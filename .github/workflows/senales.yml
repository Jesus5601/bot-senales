name: Senales

on:
  schedule:
    - cron: "*/5 * * * *"   # respaldo: GitHub no garantiza este horario
  workflow_dispatch:         # lo dispara cron-job.org cada 5 min (o el botón "Run workflow")
    inputs:
      diagnostico_horas:
        description: "Solo listar los avisos de las últimas N horas (sin enviarlos). Vacío = normal."
        required: false
        default: ""
      prueba:
        description: "Enviar solo una notificación de prueba al celular"
        type: boolean
        default: false

permissions:
  contents: write            # para guardar estado.json en el repositorio

concurrency:
  group: senales
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # siempre el estado.json más reciente

      - name: Revisar mercados
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DIAGNOSTICO_HORAS: ${{ github.event.inputs.diagnostico_horas }}
          ENVIAR_PRUEBA: ${{ github.event.inputs.prueba }}
        run: python3 bot.py

      - name: Guardar estado
        run: |
          git config user.name "bot-senales"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado del bot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
